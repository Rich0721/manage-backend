[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manage-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=3.0,<4.0",
    "asyncpg>=0.30,<1.0",
    "fastapi==0.141.1",
    "pydantic-settings>=2.10,<3.0",
    "redis>=6.4,<7.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.2,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["config*", "src*"]